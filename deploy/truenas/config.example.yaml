schema_version: 1
library_root: /library
# Runtime equivalents: WIIBRIDGE_WII_LIBRARY / WIIBRIDGE_GAMECUBE_LIBRARY.
wii_library_root: /library
gamecube_library_root: /library
data_root: /data
default_catalog: all
https:
  listen: ":8445"
nbd:
  listen: ":10809"
  require_tls: true
  require_client_certificate: true
  export: all
  request_timeout: 30s
  max_request_bytes: 1048576
cache:
  metadata_max_bytes: 67108864
  payload_cache_enabled: false
gamecube_saves:
  mode: physical
  card_size_bytes: 16777216
  auto_create: true
  shared_card: shared
  maximum_backups: 5
  automatic_backup_interval: 0s
performance:
  enabled: true
  session_history: true
  maximum_sessions: 100
  session_retention_days: 30
  pi_poll_interval: 10s
  dashboard_refresh_interval: 5s
  persistence_interval: 1m
  p99_warning: 100ms
  memory_warning_percent: 85
