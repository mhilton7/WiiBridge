# Replace every CHANGE_ME value and pin the image by the published digest.
services:
  wiibridge-host:
    # Publish the supplied OCI layout under this name without altering it.
    image: ghcr.io/CHANGE_ME/wiibridge-host:sha-7fd0c3ae8ef4318e11c1b36595cf3e5c40eaaa92@sha256:4df501302aee625f50f125b5e21c4f3c7402408cd40cdfebaab8d7991227749b
    user: "568:568"
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      WIIBRIDGE_LIBRARY: /library
      WIIBRIDGE_WII_LIBRARY: ${WIIBRIDGE_WII_LIBRARY:-/library}
      WIIBRIDGE_GAMECUBE_LIBRARY: ${WIIBRIDGE_GAMECUBE_LIBRARY:-/library}
      WIIBRIDGE_DATA: /data
      WIIBRIDGE_ADMIN_TOKEN: CHANGE_ME_USE_UI_SECRET_VALUE
      WIIBRIDGE_GAMECUBE_MEMORY_CARD_MODE: physical
      WIIBRIDGE_GAMECUBE_CARD_SIZE_BYTES: "16777216"
      WIIBRIDGE_GAMECUBE_AUTO_CREATE_CARDS: "true"
      WIIBRIDGE_GAMECUBE_SHARED_CARD: shared
      WIIBRIDGE_GAMECUBE_MAX_SAVE_BACKUPS: "5"
      WIIBRIDGE_GAMECUBE_AUTO_BACKUP_INTERVAL: 0s
      WIIBRIDGE_PERFORMANCE_METRICS_ENABLED: "true"
      WIIBRIDGE_SESSION_HISTORY_ENABLED: "true"
      WIIBRIDGE_MAX_RETAINED_SESSIONS: "100"
      WIIBRIDGE_SESSION_RETENTION_DAYS: "30"
      WIIBRIDGE_PI_METRICS_POLL_INTERVAL: 10s
      WIIBRIDGE_DASHBOARD_REFRESH_INTERVAL: 5s
      WIIBRIDGE_METRICS_PERSISTENCE_INTERVAL: 1m
      WIIBRIDGE_PERF_P99_WARNING: 100ms
      WIIBRIDGE_PERF_MEMORY_WARNING_PERCENT: "85"
      WIIBRIDGE_HTTPS_LISTEN: :8445
      WIIBRIDGE_NBD_LISTEN: :10809
      WIIBRIDGE_EXPORT: all
      WIIBRIDGE_TLS_CERT: /certs/server.crt
      WIIBRIDGE_TLS_KEY: /certs/server.key
      WIIBRIDGE_TLS_CLIENT_CA: /certs/clients-ca.crt
      # Optional, all-or-nothing automatic platform switching configuration.
      WIIBRIDGE_PI_URL: ""
      WIIBRIDGE_PI_ADMIN_TOKEN: ""
      WIIBRIDGE_PI_CERT: ""
      GOMEMLIMIT: 384MiB
    ports:
      - "CHANGE_ME_TRUENAS_LAN_IP:8445:8445/tcp"
      - "CHANGE_ME_TRUENAS_PI_IP:10809:10809/tcp"
    volumes:
      - {type: bind, source: /mnt/CHANGE_ME/WII_DATASET, target: /library, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /mnt/CHANGE_ME/apps/wiibridge/config, target: /config, bind: {create_host_path: false}}
      - {type: bind, source: /mnt/CHANGE_ME/apps/wiibridge/data, target: /data, bind: {create_host_path: false}}
      - {type: bind, source: /mnt/CHANGE_ME/apps/wiibridge/certs, target: /certs, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /mnt/CHANGE_ME/apps/wiibridge/logs, target: /logs, bind: {create_host_path: false}}
      - {type: bind, source: /mnt/CHANGE_ME/apps/wiibridge/backups, target: /backups, bind: {create_host_path: false}}
    tmpfs: [/tmp:size=32m,mode=1777,noexec,nosuid,nodev]
    healthcheck:
      test: [CMD, /wiibridge-host, healthcheck, --url, "https://127.0.0.1:8445/healthz", --ca, /certs/ca.crt]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 512m
    cpus: 2.0
