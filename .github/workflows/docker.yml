name: Docker Image CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p build/container-root
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "${BUILD_TIME}" > build/container-root/.build-time
          go build -trimpath \
            -ldflags="-s -w -buildid= -X main.gitCommit=${GITHUB_SHA} -X main.buildTime=${BUILD_TIME} -X main.buildDirty=false" \
            -o build/container-root/wiibridge-host \
            ./server/host-daemon

      - name: Test source identity and recovery
        run: |
          go test -race ./server/... ./pi/... ./shared/... ./tests/... \
            ./scripts/synthetic-wbfs ./scripts/gamecube-volume ./scripts/gamecube-saves
          go vet ./server/... ./pi/... ./shared/... ./tests/...
          mkdir -p build/bin
          cp build/container-root/wiibridge-host build/bin/wiibridge-host
          sudo -n python3 tests/truenas/separate-libraries-test.py

      - name: Build Docker image
        run: |
          BUILD_TIME="$(cat build/container-root/.build-time)"
          docker build . \
            --file server/packaging/container/Dockerfile \
            --build-arg "OCI_REVISION=${GITHUB_SHA}" \
            --build-arg "OCI_VERSION=0.1.0-rc.1" \
            --build-arg "OCI_CREATED=${BUILD_TIME}" \
            --build-arg "OCI_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "wiibridge-host:${GITHUB_SHA}"

      - name: Verify binary and OCI identity
        run: |
          VERSION_OUTPUT="$(docker run --rm "wiibridge-host:${GITHUB_SHA}" version)"
          printf '%s\n' "${VERSION_OUTPUT}"
          printf '%s\n' "${VERSION_OUTPUT}" | grep -F "commit ${GITHUB_SHA}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "wiibridge-host:${GITHUB_SHA}")" = "${GITHUB_SHA}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' "wiibridge-host:${GITHUB_SHA}")" = "$(cat build/container-root/.build-time)"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/wiibridge-host
          VERSION: 0.1.0-rc.1
        run: |
          docker tag "wiibridge-host:${GITHUB_SHA}" "${IMAGE}:${VERSION}"
          docker tag "wiibridge-host:${GITHUB_SHA}" "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
